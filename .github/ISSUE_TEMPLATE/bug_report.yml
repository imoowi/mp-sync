name: Bug report
description: 报告可复现的同步或界面问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先移除 Cookie、令牌、账号密码和未公开文章内容。安全问题请使用 SECURITY.md 中的私下报告渠道。
  - type: input
    id: version
    attributes:
      label: 扩展版本
      placeholder: 0.2.3
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Microsoft Edge
        - Google Chrome
        - 其他 Chromium 浏览器
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 目标平台
      placeholder: 掘金、CSDN、知乎等
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请提供从打开文章到出现问题的完整步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误信息或日志
      description: 可在扩展的 service worker 控制台中复制，但请先删除敏感信息。
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除 Cookie、令牌、密码和未公开内容。
          required: true
